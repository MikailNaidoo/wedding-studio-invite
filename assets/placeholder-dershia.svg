<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Animated South Indian bride portrait placeholder</title>
  <desc id="desc">Original animated South Indian bride illustration in a silk saree with wedding jewellery.</desc>
  <defs>
    <linearGradient id="bg" x1="1" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7f1d34"/>
      <stop offset="0.52" stop-color="#d8af5b"/>
      <stop offset="1" stop-color="#193f35"/>
    </linearGradient>
    <style>
      @keyframes brideFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
      @keyframes jewelBlink { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      .bride { animation: brideFloat 6.5s ease-in-out infinite; transform-origin: 50% 70%; }
      .jewel { animation: jewelBlink 2.4s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="1100" fill="url(#bg)"/>
  <circle cx="580" cy="156" r="210" fill="#fff9ed" opacity="0.18"/>
  <path d="M116 242c110-74 234-104 372-92" stroke="#eaff45" stroke-width="6" opacity="0.44" fill="none"/>
  <g class="bride">
    <path d="M404 136c158 0 268 134 230 362-22 136-104 230-230 230s-208-94-230-230c-38-228 72-362 230-362Z" fill="#171411"/>
    <circle cx="404" cy="330" r="94" fill="#c78252"/>
    <path d="M184 482c-30-216 58-382 220-382s250 166 220 382c-48-112-110-166-220-166s-172 54-220 166Z" fill="#171411"/>
    <path d="M124 1100c20-252 124-404 280-404s260 152 280 404Z" fill="#8f1432"/>
    <path d="M168 1100c44-170 122-274 236-274s192 104 236 274Z" fill="#f7efe1" opacity="0.9"/>
    <path d="M250 832c76 54 232 54 308 0" stroke="#d8af5b" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M252 710c78 66 226 66 304 0" stroke="#fff9ed" stroke-width="18" fill="none" opacity="0.72"/>
    <circle class="jewel" cx="404" cy="242" r="14" fill="#fff9ed"/>
    <circle class="jewel" cx="334" cy="364" r="10" fill="#d8af5b"/>
    <circle class="jewel" cx="474" cy="364" r="10" fill="#d8af5b"/>
  </g>
</svg>
