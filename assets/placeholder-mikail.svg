<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Animated South Indian groom portrait placeholder</title>
  <desc id="desc">Original animated South Indian groom illustration in traditional wedding attire.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#193f35"/>
      <stop offset="0.56" stop-color="#7f1d34"/>
      <stop offset="1" stop-color="#d8af5b"/>
    </linearGradient>
    <style>
      @keyframes groomFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
      @keyframes goldPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .groom { animation: groomFloat 6s ease-in-out infinite; transform-origin: 50% 70%; }
      .shine { animation: goldPulse 2.8s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="1100" fill="url(#bg)"/>
  <circle cx="240" cy="158" r="210" fill="#fff9ed" opacity="0.14"/>
  <path d="M82 918c142-76 274-112 438-98" stroke="#eaff45" stroke-width="6" opacity="0.42" fill="none"/>
  <g class="groom">
    <path d="M244 172c94-76 218-76 312 0 54 86 60 222 32 346-34 148-112 236-188 236s-154-88-188-236c-28-124-22-260 32-346Z" fill="#171411"/>
    <circle cx="400" cy="342" r="96" fill="#b9744b"/>
    <path d="M270 326c42-152 234-208 336-48-20-122-100-198-204-198-94 0-160 68-132 246Z" fill="#171411"/>
    <path d="M186 1100c26-236 132-376 214-376s188 140 214 376Z" fill="#fff9ed" opacity="0.94"/>
    <path d="M270 858h260l78 242H192Z" fill="#193f35"/>
    <path d="M340 800l60 124 62-124" stroke="#d8af5b" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M266 138c76-88 190-88 268 0v86H266Z" fill="#fff9ed"/>
    <path class="shine" d="M298 124h204M318 174h164" stroke="#d8af5b" stroke-width="18" stroke-linecap="round"/>
    <circle class="shine" cx="400" cy="254" r="12" fill="#fff9ed"/>
  </g>
</svg>
