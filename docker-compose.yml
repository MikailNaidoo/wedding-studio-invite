services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding-rsvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wedding_rsvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wedding_rsvp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wedding_rsvp"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  wedding_rsvp_postgres:
